<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام SMC وسحب السيولة (السكالبينج الاحترافي)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        body.flash-buy { background-color: #033a16; }
        .container.flash-buy { border-color: #2ea043; box-shadow: 0 0 30px rgba(46, 160, 67, 0.6); }
        
        body.flash-sell { background-color: #4c1113; }
        .container.flash-sell { border-color: #f85149; box-shadow: 0 0 30px rgba(248, 81, 73, 0.6); }

        h2 {
            text-align: center;
            color: #f0883e;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 17px;
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 11px;
            margin-bottom: 15px;
        }
        .status {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 15px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #f85149;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
        }
        .dot.connected { background-color: #2ea043; }
        
        .price-box {
            background-color: #21262d;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 12px;
        }
        .price-title { font-size: 12px; color: #8b949e; }
        .price-value { font-size: 26px; font-weight: bold; color: #ffffff; margin-top: 5px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .card {
            background-color: #21262d;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .card.bid { border-top: 3px solid #2ea043; }
        .card.ask { border-top: 3px solid #f85149; }
        .card-title { font-size: 11px; color: #8b949e; margin-bottom: 3px; }
        .card-value { font-size: 15px; font-weight: bold; }
        .bid .card-value { color: #2ea043; }
        .ask .card-value { color: #f85149; }

        .targets-box {
            background-color: #1f242c;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .target-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .target-label { color: #8b949e; }
        .tp-val { color: #2ea043; font-weight: bold; }
        .sl-val { color: #f85149; font-weight: bold; }

        .signal-box {
            background-color: #1f242c;
            border: 1px dashed #f0883e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .signal-title { font-size: 10px; color: #8b949e; margin-bottom: 3px; }
        .signal-action { font-size: 14px; font-weight: bold; color: #f0883e; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h2>نظام SMC وسحب السيولة (SMC Scalp)</h2>
    <div class="subtitle">اصطياد الارتداد بعد ضرب السيولة</div>
    
    <div class="status">
        الحالة: <span id="status-text">جاري الاتصال...</span>
        <span id="connection-dot" class="dot"></span>
    </div>

    <div class="price-box">
        <div class="price-title">السعر الفوري الحالي (مطابق لـ MT5)</div>
        <div id="live-price" class="price-value">--</div>
    </div>

    <div class="grid">
        <div class="card bid">
            <div class="card-title">سعر الطلب (Bid)</div>
            <div id="bid-price" class="card-value">--</div>
        </div>
        <div class="card ask">
            <div class="card-title">سعر العرض (Ask)</div>
            <div id="ask-price" class="card-value">--</div>
        </div>
    </div>

    <div class="targets-box">
        <div class="target-row">
            <span class="target-label">هدف الربح (TP):</span>
            <span id="tp-val" class="tp-val">--</span>
        </div>
        <div class="target-row">
            <span class="target-label">وقف الخسارة المحمي (SL):</span>
            <span id="sl-val" class="sl-val">--</span>
        </div>
    </div>

    <div class="signal-box">
        <div class="signal-title">توجيه التداول الذكي</div>
        <div id="signal-text" class="signal-action">جاري مراقبة مناطق السيولة...</div>
    </div>
</div>

<script>
    const wsUrl = 'wss://stream.binance.com:9443/ws/btcusdt@bookTicker';
    const priceOffset = -40; // فارق السعر لمطابقة MT5

    // إعدادات تليجرام الخاصة بك
    const telegramToken = '8547422933:AAG8fuNsOTovdoJ3PcHProubn2Knrinkhmw';
    const chatId = '-1003900259258';

    let lastAlertState = 'neutral'; 
    let lastAlertTime = 0;
    let priceHistory = [];

    function sendTelegramAlert(message) {
        const now = Date.now();
        if (now - lastAlertTime < 120000) return; // منع التكرار لمدة دقيقتين

        const url = `https://api.telegram.org/bot${telegramToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if(data.ok) {
                    lastAlertTime = now;
                }
            })
            .catch(error => console.error('خطأ في إرسال التنبيه:', error));
    }

    const bodyElement = document.body;
    const containerElement = document.getElementById('main-container');
    const priceElement = document.getElementById('live-price');
    const bidElement = document.getElementById('bid-price');
    const askElement = document.getElementById('ask-price');
    const statusText = document.getElementById('status-text');
    const connectionDot = document.getElementById('connection-dot');
    
    const tpElement = document.getElementById('tp-val');
    const slElement = document.getElementById('sl-val');
    const signalTextElement = document.getElementById('signal-text');

    function connectWebSocket() {
        const ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            statusText.innerText = 'متصل بنظام SMC الحقيقي';
            connectionDot.classList.add('connected');
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            const bestBid = parseFloat(data.b) + priceOffset;
            const bestAsk = parseFloat(data.a) + priceOffset;
            const midPrice = (bestBid + bestAsk) / 2;

            bidElement.innerText = `$${bestBid.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            askElement.innerText = `$${bestAsk.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            priceElement.innerText = `$${midPrice.toLocaleString('en-US', {minimumFractionDigits: 2})}`;

            // تخزين الأسعار لمراقبة السلوك (آخر 5 تحديثات سريعة)
            priceHistory.push(midPrice);
            if (priceHistory.length > 6) {
                priceHistory.shift();
            }

            if (priceHistory.length < 6) return;

            // قياس نمط السيولة: هل حدث هبوط حاد (سحب سيولة قاع) ثم ارتداد صعودي؟ أو صعود حاد (سحب سيولة قمة) ثم هبوط؟
            let minPrice = Math.min(...priceHistory);
            let maxPrice = Math.max(...priceHistory);
            let spreadRange = maxPrice - minPrice;

            bodyElement.classList.remove('flash-buy', 'flash-sell');
            containerElement.classList.remove('flash-buy', 'flash-sell');

            // شرط الشراء: إذا نزل السعر بشكل حاد (سحب السيولة السفلى) ثم ارتد وأغلق أعلى القاع بقليل (منطقة الخصم ودعم صلب)
            if (midPrice <= minPrice + (spreadRange * 0.3) && midPrice > minPrice) {
                let tp = midPrice + 120;
                let sl = minPrice - 40; // وقف الخسارة محمي تحت القاع المسحوب مباشرة
                
                tpElement.innerText = `$${tp.toFixed(0)}`;
                slElement.innerText = `$${sl.toFixed(0)}`;

                bodyElement.classList.add('flash-buy');
                containerElement.classList.add('flash-buy');
                signalTextElement.innerHTML = "🟢 شراء عكسي (ارتداد من سحب السيولة)";

                if (lastAlertState !== 'buy') {
                    lastAlertState = 'buy';
                    sendTelegramAlert(`🛡️ تنبيه SMC شراء (مضمون الارتداد)\nالسعر الحالي: $${midPrice.toFixed(2)}\nتم سحب سيولة القاع وارتداد السعر\nهدف الربح (TP): $${tp.toFixed(0)}\nوقف الخسارة المحمي (SL): $${sl.toFixed(0)}`);
                }
            } 
            // شرط البيع: إذا صعد السعر بشكل حاد (سحب السيولة العليا) ثم بدأ بالارتداد للأسفل
            else if (midPrice >= maxPrice - (spreadRange * 0.3) && midPrice < maxPrice) {
                let tp = midPrice - 120;
                let sl = maxPrice + 40; // وقف الخسارة محمي فوق القمة المسحوبة مباشرة

                tpElement.innerText = `$${tp.toFixed(0)}`;
                slElement.innerText = `$${sl.toFixed(0)}`;

                bodyElement.classList.add('flash-sell');
                containerElement.classList.add('flash-sell');
                signalTextElement.innerHTML = "🔴 بيع عكسي (ارتداد من سحب السيولة)";

                if (lastAlertState !== 'sell') {
                    lastAlertState = 'sell';
                    sendTelegramAlert(`🛡️ تنبيه SMC بيع (مضمون الارتداد)\nالسعر الحالي: $${midPrice.toFixed(2)}\nتم سحب سيولة القمة وارتداد السعر\nهدف الربح (TP): $${tp.toFixed(0)}\nوقف الخسارة المحمي (SL): $${sl.toFixed(0)}`);
                }
            } 
            else {
                tpElement.innerText = `بانتظار تأكيد الارتداد`;
                slElement.innerText = `--`;
                signalTextElement.innerHTML = "⏳ مراقبة صانع السوق (تجنب الفخاخ)";
                lastAlertState = 'neutral';
            }
        };

        ws.onerror = function() {
            statusText.innerText = 'خطأ في الاتصال';
            connectionDot.classList.remove('connected');
        };

        ws.onclose = function() {
            statusText.innerText = 'انقطع الاتصال، جاري إعادة المحاولة...';
            connectionDot.classList.remove('connected');
            setTimeout(connectWebSocket, 3000);
        };
    }

    connectWebSocket();
</script>

</body>
</html>
